<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAYONE AI — Universal Command Center</title>
<style>
:root{--bg:#071016;--panel:#0d1a21;--panel2:#101f28;--line:#263c46;--text:#e8f1f5;--muted:#8ea3ad;--accent:#8fe0b3;--accent2:#7cc9ff;--danger:#ff9292}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#16303b 0,#071016 38%);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:64px;border-bottom:1px solid var(--line);background:#09151cdd;backdrop-filter:blur(12px);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:21px;letter-spacing:2px}.pill{border:1px solid #31505c;border-radius:999px;padding:6px 10px;color:var(--accent);font-size:12px}.grow{flex:1}.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:12px;background:#09141b;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}aside button{display:block;width:100%;border:0;background:transparent;color:#b7c8cf;text-align:left;padding:10px 12px;border-radius:10px;margin:2px 0}aside button:hover,aside button.active{background:#132832;color:#fff}main{padding:22px;max-width:1500px;width:100%;margin:auto}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:linear-gradient(145deg,#102029,#0b171d);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 10px 30px #0004}.num{font-size:28px;font-weight:850;margin-top:5px}.muted{color:var(--muted)}.row{display:flex;gap:9px}.row>*{flex:1}input,textarea,select{width:100%;background:#081219;color:var(--text);border:1px solid #2c4652;border-radius:10px;padding:10px}textarea{min-height:100px;resize:vertical}.btn{border-radius:10px;padding:10px 14px;border:1px solid #31505c;background:#132630;color:#e6f5ed;font-weight:650}.primary{background:#dceee5;color:#071016;border-color:transparent}.danger{color:var(--danger)}.list{display:grid;gap:8px;margin-top:12px}.item{border:1px solid #243943;background:#0b171e;border-radius:11px;padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chatbox{min-height:380px;max-height:58vh;overflow:auto}.msg{white-space:pre-wrap;padding:11px 13px;background:#12232b;border-radius:12px;margin:8px 0}.me{background:#19382d}.trace{font:12px ui-monospace,monospace;white-space:pre-wrap;max-height:420px;overflow:auto}.login{max-width:420px;margin:13vh auto;padding:18px}.state{color:var(--accent)}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{height:auto;position:sticky;top:64px;z-index:8;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}aside button{min-width:max-content}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{padding:13px}.grid,.two{grid-template-columns:1fr}.top{padding:0 12px}.top .hide{display:none}}
</style></head><body><div id="root"></div>
<script>
const root=document.getElementById('root');let token=localStorage.rayone_token||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(url,opt);if(r.status===401){logout();throw Error('Authentication required')}if(!r.ok)throw Error(await r.text());return r.json()}
function loginUI(){root.innerHTML='<div class=login><div class=card><div class=brand>RAYONE AI</div><p class=muted>Universal AI Command Center</p><input id=p type=password placeholder="Admin password"><button class="btn primary" style="width:100%;margin-top:10px" onclick=login()>Enter Command Center</button><p id=e class=danger></p></div></div>';p.onkeydown=x=>x.key==='Enter'&&login()}
async function login(){try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});if(!r.ok)throw Error('Invalid credentials');let d=await r.json();token=d.token;localStorage.rayone_token=token;app()}catch(x){e.textContent=x.message}}
function logout(){token='';localStorage.removeItem('rayone_token');loginUI()}
const nav=[['home','⌂ Home'],['assistant','◉ RAYONE Assistant'],['projects','▦ Projects'],['providers','◉ Providers'],['models','◆ Models'],['tools','⚙ Tools'],['native','⚡ Native Engines'],['agents','◈ Agents'],['workflows','↯ Workflows'],['memory','◆ Memory'],['files','▤ Knowledge / Files'],['automation','◷ Automation'],['media','◇ Creative / Media'],['connectors','⬡ Connectors'],['security','▣ Security / Approval'],['observability','◌ Observability'],['recovery','⟳ Recovery'],['settings','⚙ Settings']];
function app(){root.innerHTML='<header class=top><div class=brand>RAYONE AI</div><span class=pill>CORE ONLINE</span><span class="muted hide">RAYONE → VORQYON → VERIFIED</span><span class=grow></span><button class=btn onclick=diag()>Diagnostics</button><span id=engine class=pill>LOCAL ENGINES</span><button class=btn onclick=logout()>Logout</button></header><div class=shell><aside>'+nav.map((n,i)=>'<button class="'+(i?'':'active')+'" onclick="show(\u0027'+n[0]+'\u0027,this)">'+n[1]+'</button>').join('')+'</aside><main>'+
'<section id=home class="view active"><h1>Universal Command Center</h1><p class=muted>One intelligence core · controlled execution · verification · audit · recovery</p><div id=stats class=grid></div><div class=card style="margin-top:14px"><h3>System Pipeline</h3><p class=muted>User → Auth → RAYONE Core → Context/Memory → Planner → Router → Model / Tool / Agent / Workflow → VORQYON → Verification → Result → Audit/Metrics → Recovery</p></div></section>'+
'<section id=assistant class=view><h1>RAYONE Assistant</h1><div class=card><div id=chat class=chatbox></div><div class=row><input id=msg placeholder="Ask RAYONE anything…"><button class="btn primary" onclick=ask()>Run</button></div><div class=toolbar><button class=btn onclick=voice()>Voice Input</button><button class=btn onclick=loadTrace()>Execution Trace</button></div></div></section>'+
'<section id=projects class=view><h1>Projects</h1><div class=card><div class=row><input id=pn placeholder="Project name"><button class="btn primary" onclick=addProject()>Create</button></div><div id=pl class=list></div></div></section>'+
'<section id=providers class=view><h1>AI Providers</h1><div class=card><div class=two><input id=prn placeholder="Provider name"><input id=pru placeholder="Base URL"><input id=prk type=password placeholder="API key"><select id=prkind><option>openai_compatible</option><option>ollama</option><option>lmstudio</option></select><button class="btn primary" onclick=addProvider()>Add Provider</button></div><div id=prl class=list></div></div></section>'+
'<section id=models class=view><h1>Models</h1><div class=card><div class=two><input id=mn placeholder="Display name"><input id=mi placeholder="Model identifier"><select id=mp></select></div><button class="btn primary" onclick=addModel()>Add Model</button><div id=ml class=list></div></div></section>'+
'<section id=tools class=view><h1>Tool Engine</h1><div class=card><div id=tl class=list></div></div></section>'+'<section id=native class=view><h1>Native Advanced Engines</h1><div class=card><div class=toolbar><button class="btn primary" onclick=nativeStatus()>Engine Status</button><button class=btn onclick=nativeSearch()>Workspace Search</button></div><div class=row><input id=nq placeholder="Search your local knowledge/workspace"><button class="btn primary" onclick=nativeSearch()>Search</button></div><pre id=no class=trace></pre></div></section>+
'<section id=agents class=view><h1>Agents</h1><div class=card><div class=two><input id=an placeholder="Agent name"><input id=ad placeholder="Description"><select id=am></select></div><button class="btn primary" onclick=addAgent()>Create Agent</button><div id=al class=list></div></div></section>'+
'<section id=workflows class=view><h1>Workflows</h1><div class=card><div class=two><input id=wn placeholder="Workflow name"><textarea id=ws placeholder=\'[{"type":"tool","name":"core.echo","args":{"text":"hello"}}]\'></textarea></div><button class="btn primary" onclick=addWorkflow()>Create Workflow</button><div id=wl class=list></div></div></section>'+
'<section id=memory class=view><h1>Memory / Context</h1><div class=card><div class=row><input id=mt placeholder="Store durable memory"><button class="btn primary" onclick=saveMemory()>Save</button></div><div id=meml class=list></div></div></section>'+
'<section id=files class=view><h1>Knowledge / Files</h1><div class=card><input id=file type=file><button class="btn primary" onclick=upload()>Upload</button><div id=fl class=list></div></div></section>'+
'<section id=automation class=view><h1>Automation / Scheduler</h1><div class=card><div class=two><input id=sn placeholder="Schedule name"><input id=se placeholder="Interval seconds (e.g. 3600)"><input id=sm placeholder="Chat message"><select id=sa><option>chat</option></select></div><button class="btn primary" onclick=addSchedule()>Create Schedule</button><div id=sl class=list></div></div></section>'+
'<section id=media class=view><h1>Creative / Media</h1><div class=card><div class=two><select id=mk><option>image</option><option>video</option><option>audio</option><option>voice</option><option>music</option></select><textarea id=mi2 placeholder="Describe the media job"></textarea></div><button class="btn primary" onclick=addMedia()>Queue Media Job</button><div id=medl class=list></div></div></section>'+
'<section id=connectors class=view><h1>Connectors / Plugins</h1><div class=card><div class=two><input id=cn placeholder="Connector name"><input id=ck placeholder="Type: github, email, whatsapp…"><input id=cu placeholder="Base URL"><textarea id=cc placeholder="Config JSON"></textarea></div><button class="btn primary" onclick=addConnector()>Register Connector</button><div id=cl class=list></div></div></section>'+
'<section id=security class=view><h1>Security / Permissions / Approval</h1><div class=card><h3>Permissions</h3><div class=row><input id=pc placeholder="Capability"><input id=ps placeholder="Scope"><button class="btn primary" onclick=addPermission()>Allow</button></div><div id=perml class=list></div><h3>Pending Approvals</h3><div id=appl class=list></div></div></section>'+
'<section id=observability class=view><h1>Observability</h1><div class=card><button class=btn onclick=loadObs()>Refresh</button><pre id=obs class=trace></pre></div></section>'+
'<section id=recovery class=view><h1>Recovery / Checkpoints</h1><div class=card><div class=toolbar><button class="btn primary" onclick=checkpoint()>Create Checkpoint</button><button class=btn onclick=restore()>Restore Last</button><button class=btn onclick=exportState()>Export State</button><button class=btn onclick=createBackup()>Create Backup</button><button class=btn onclick=listBackups()>Backup List</button></div><pre id=rec class=trace></pre></div></section>'+
'<section id=settings class=view><h1>System Settings</h1><div class=card><h3>Admin Password</h3><div class=row><input id=oldpass type=password placeholder="Current password"><input id=newpass type=password placeholder="New password (12+ chars)"><button class="btn primary" onclick=changePassword()>Change Password</button></div><button class=btn onclick=loadSettings()>Refresh Security Config</button><button class=btn onclick=providerHealth()>Provider Health</button><pre id=setout class=trace></pre></div></section>'+
'</main></div>';loadHome()}
function show(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(id)}
async function load(id){try{if(id==='home')loadHome();if(id==='projects')loadProjects();if(id==='providers')loadProviders();if(id==='models')loadModels();if(id==='tools')loadTools();if(id==='native')nativeStatus();if(id==='agents')loadAgents();if(id==='workflows')loadWorkflows();if(id==='memory')loadMemory();if(id==='files')loadFiles();if(id==='automation')loadSchedules();if(id==='media')loadMedia();if(id==='connectors')loadConnectors();if(id==='security')loadSecurity();if(id==='observability')loadObs();if(id==='settings')loadSettings()}catch(e){alert(e.message)}}
async function loadHome(){let x=await api('/api/v2/status');try{let n=await api('/api/v2/native/status');engine.textContent='NATIVE '+(Object.values(n.engines).filter(Boolean).length)+' ONLINE'}catch(e){}stats.innerHTML=Object.entries(x.counts).map(([k,v])=>'<div class=card><div class=muted>'+esc(k)+'</div><div class=num>'+v+'</div></div>').join('')}
async function ask(){let v=msg.value.trim();if(!v)return;chat.innerHTML+='<div class="msg me">'+esc(v)+'</div>';msg.value='';let x=await api('/api/v2/assistant/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});chat.innerHTML+='<div class=msg>'+esc(x.answer||x.message||JSON.stringify(x.result||x))+'<div class=muted>'+esc(x.state||x.provider||x.intent||'')+'</div></div>';if(x.answer&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(x.answer))}chat.scrollTop=chat.scrollHeight}
function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Speech recognition is not available in this browser.');let r=new R();r.lang='en-IN';r.onresult=e=>{msg.value=e.results[0][0].transcript;ask()};r.start()}
async function loadProjects(){let x=await api('/api/projects');pl.innerHTML=x.map(p=>'<div class=item><b>'+esc(p.name)+'</b><div class=muted>'+esc(p.type)+' · '+esc(p.status)+'</div></div>').join('')||'<div class=muted>No projects.</div>'}
async function addProject(){if(!pn.value.trim())return;await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:pn.value})});pn.value='';loadProjects();loadHome()}
async function loadProviders(){let x=await api('/api/providers');prl.innerHTML=x.map(p=>'<div class=item><b>'+esc(p.name)+'</b><div class=muted>'+esc(p.kind)+' · '+esc(p.base_url||'local')+'</div></div>').join('')||'<div class=muted>No providers.</div>'}
async function addProvider(){await api('/api/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:prn.value,base_url:pru.value,api_key:prk.value,kind:prkind.value})});prn.value=pru.value=prk.value='';loadProviders()}
async function loadModels(){let p=await api('/api/providers'),m=await api('/api/models');mp.innerHTML='<option value="">No provider</option>'+p.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');ml.innerHTML=m.map(x=>'<div class=item><b>'+esc(x.name)+'</b><div class=muted>'+esc(x.model)+'</div></div>').join('')||'<div class=muted>No models.</div>'}
async function addModel(){await api('/api/models',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:mn.value,model:mi.value,provider_id:mp.value||null})});mn.value=mi.value='';loadModels()}
async function nativeStatus(){let x=await api('/api/v2/native/status');no.textContent=JSON.stringify(x,null,2)}
async function nativeSearch(){let q=nq.value.trim();if(!q)return;no.textContent=JSON.stringify(await api('/api/v2/native/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})}),null,2)}
async function loadTools(){let x=await api('/api/tools'),c=await api('/api/v2/tools/catalog');tl.innerHTML='<div class=item><b>Local zero-cost tool pack: '+c.count+' executable operations</b><div class=muted>Families: '+esc(c.families.join(', '))+'</div></div>'+x.map(t=>'<div class=item><b>'+esc(t.name)+'</b><div class=muted>'+esc(t.description)+' · '+(t.enabled?'enabled':'disabled')+'</div></div>').join('')}
async function loadAgents(){let m=await api('/api/models'),a=await api('/api/agents');am.innerHTML='<option value="">Auto model</option>'+m.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');al.innerHTML=a.map(x=>'<div class=item><b>'+esc(x.name)+'</b><div class=muted>'+esc(x.description)+'</div></div>').join('')||'<div class=muted>No agents.</div>'}
async function addAgent(){await api('/api/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:an.value,description:ad.value,model_id:am.value||null})});an.value=ad.value='';loadAgents()}
async function loadWorkflows(){let x=await api('/api/workflows');wl.innerHTML=x.map(w=>'<div class=item><b>'+esc(w.name)+'</b><div class=muted>v'+w.version+' · '+w.steps.length+' steps</div><button class=btn onclick="runW(\u0027'+w.id+'\u0027)">Run</button></div>').join('')||'<div class=muted>No workflows.</div>'}
async function addWorkflow(){let steps;try{steps=JSON.parse(ws.value||'[]')}catch(e){return alert('Invalid JSON')};await api('/api/workflows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:wn.value,steps})});wn.value=ws.value='';loadWorkflows()}
async function runW(id){alert(JSON.stringify(await api('/api/workflows/'+id+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),null,2))}
async function saveMemory(){if(!mt.value.trim())return;await api('/api/memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:mt.value})});mt.value='';loadMemory()}
async function loadMemory(){let x=await api('/api/memory/search?q=');meml.innerHTML=x.map(m=>'<div class=item>'+esc(m.content)+'</div>').join('')||'<div class=muted>No memory.</div>'}
async function upload(){if(!file.files[0])return;let f=new FormData();f.append('file',file.files[0]);await api('/api/v2/files/upload',{method:'POST',body:f});file.value='';loadFiles()}
async function loadFiles(){let x=await api('/api/v2/files');fl.innerHTML=x.map(f=>'<div class=item><b>'+esc(f.name)+'</b><div class=muted>'+f.size+' bytes · '+esc(f.mime)+'</div><button class=btn onclick="downloadFile(\u0027'+f.id+'\u0027)">Download</button><button class=btn onclick="indexFile(\u0027'+f.id+'\u0027)">Index</button></div>').join('')||'<div class=muted>No files.</div>'}
async function addSchedule(){let payload={message:sm.value};await api('/api/v2/automation/schedules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:sn.value,expression:se.value||'3600',action:sa.value,payload})});sn.value=se.value=sm.value='';loadSchedules()}
async function loadSchedules(){let x=await api('/api/v2/automation/schedules');sl.innerHTML=x.map(s=>'<div class=item><b>'+esc(s.name)+'</b><div class=muted>'+esc(s.kind)+' · every '+esc(s.expression)+' sec · '+(s.enabled?'enabled':'disabled')+'</div></div>').join('')||'<div class=muted>No schedules.</div>'}
async function addMedia(){await api('/api/v2/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:mk.value,input:{prompt:mi2.value}})});mi2.value='';loadMedia()}
async function loadMedia(){let x=await api('/api/v2/media');medl.innerHTML=x.map(m=>'<div class=item><b>'+esc(m.kind)+'</b><div class=muted>'+esc(m.status)+' · '+esc(m.id)+'</div></div>').join('')||'<div class=muted>No media jobs.</div>'}
async function addConnector(){let cfg={};try{cfg=JSON.parse(cc.value||'{}')}catch(e){return alert('Invalid config JSON')};await api('/api/v2/connectors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:cn.value,kind:ck.value,base_url:cu.value,config:cfg})});cn.value=ck.value=cu.value=cc.value='';loadConnectors()}
async function loadConnectors(){let x=await api('/api/v2/connectors');cl.innerHTML=x.map(c=>'<div class=item><b>'+esc(c.name)+'</b><div class=muted>'+esc(c.kind)+' · '+esc(c.base_url||'')+'</div></div>').join('')||'<div class=muted>No connectors.</div>'}
async function addPermission(){if(!pc.value)return;await api('/api/v2/permissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({capability:pc.value,scope:ps.value||'global'})});pc.value=ps.value='';loadSecurity()}
async function loadSecurity(){let p=await api('/api/v2/permissions'),a=await api('/api/v2/approvals');perml.innerHTML=p.map(x=>'<div class=item>'+esc(x.subject)+' · <b>'+esc(x.capability)+'</b> · '+esc(x.scope)+'</div>').join('')||'<div class=muted>No permissions.</div>';appl.innerHTML=a.filter(x=>x.status==='pending').map(x=>'<div class=item><b>'+esc(x.action)+'</b> · '+esc(x.target)+' <button class=btn onclick="decide(\u0027'+x.id+'\u0027,\u0027approved\u0027)">Approve</button> <button class=btn onclick="decide(\u0027'+x.id+'\u0027,\u0027rejected\u0027)">Reject</button></div>').join('')||'<div class=muted>No pending approvals.</div>'}
async function decide(id,d){await api('/api/v2/approvals/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:d})});if(d==='approved'){try{await api('/api/v2/approvals/'+id+'/execute',{method:'POST'})}catch(e){if(!String(e.message).includes('already executed'))alert(e.message)}}loadSecurity()}
async function loadObs(){let a=await api('/api/v2/trace'),m=await api('/api/v2/metrics');obs.textContent=JSON.stringify({metrics:m,traces:a},null,2)}
async function downloadFile(id){let r=await fetch('/api/v2/files/'+id+'/download',{headers:{Authorization:'Bearer '+token}});let b=await r.blob();let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rayone-file';a.click()}
async function indexFile(id){await api('/api/v2/files/'+id+'/index',{method:'POST'});alert('Indexed into memory');}
async function createBackup(){let x=await api('/api/v2/backup/create',{method:'POST'});rec.textContent=JSON.stringify(x,null,2)}
async function listBackups(){let x=await api('/api/v2/backup/list');rec.textContent=JSON.stringify(x,null,2)}
async function changePassword(){let x=await api('/api/v2/security/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:oldpass.value,new_password:newpass.value})});setout.textContent=JSON.stringify(x,null,2);oldpass.value=newpass.value=''}
async function loadSettings(){setout.textContent=JSON.stringify(await api('/api/v2/security/config'),null,2)}
async function providerHealth(){setout.textContent=JSON.stringify(await api('/api/v2/providers/health'),null,2)}
async function loadTrace(){let a=await api('/api/v2/trace');chat.innerHTML+='<pre class=trace>'+esc(JSON.stringify(a.slice(0,20),null,2))+'</pre>'}
async function checkpoint(){let x=await api('/api/checkpoints?target=universal-control-plane',{method:'POST'});rec.textContent='Checkpoint created: '+x.id}
async function restore(){let x=await api('/api/checkpoints');if(x[0]&&confirm('Restore latest checkpoint?')){await api('/api/checkpoints/'+x[0].id+'/restore',{method:'POST'});rec.textContent='Restored: '+x[0].id}}
async function exportState(){let x=await api('/api/export');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download='rayone-state.json';a.click()}
async function diag(){alert(JSON.stringify(await api('/api/v2/diagnostics'),null,2))}
if(token){api('/api/health').then(app).catch(loginUI)}else loginUI();
</script></body></html>
