<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAYONE AI — Universal Command Center</title>
<style>
:root{--bg:#071016;--panel:#0d1a21;--panel2:#101f28;--line:#263c46;--text:#e8f1f5;--muted:#8ea3ad;--accent:#8fe0b3;--accent2:#7cc9ff;--danger:#ff9292}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#16303b 0,#071016 38%);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{height:64px;border-bottom:1px solid var(--line);background:#09151cdd;backdrop-filter:blur(12px);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:21px;letter-spacing:2px}.pill{border:1px solid #31505c;border-radius:999px;padding:6px 10px;color:var(--accent);font-size:12px}.grow{flex:1}
.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:12px;background:#09141b;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}aside button{display:block;width:100%;border:0;background:transparent;color:#b7c8cf;text-align:left;padding:10px 12px;border-radius:10px;margin:2px 0}aside button:hover,aside button.active{background:#132832;color:#fff}
main{padding:22px;max-width:1500px;width:100%;margin:auto}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:linear-gradient(145deg,#102029,#0b171d);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 10px 30px #0004}.num{font-size:28px;font-weight:850;margin-top:5px}.muted{color:var(--muted)}.row{display:flex;gap:9px}.row>*{flex:1}input,textarea,select{width:100%;background:#081219;color:var(--text);border:1px solid #2c4652;border-radius:10px;padding:10px}textarea{min-height:100px;resize:vertical}.btn{border-radius:10px;padding:10px 14px;border:1px solid #31505c;background:#132630;color:#e6f5ed;font-weight:650}.primary{background:#dceee5;color:#071016;border-color:transparent}.danger{color:var(--danger)}.list{display:grid;gap:8px;margin-top:12px}.item{border:1px solid #243943;background:#0b171e;border-radius:11px;padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chatbox{min-height:380px;max-height:58vh;overflow:auto}.msg{white-space:pre-wrap;padding:11px 13px;background:#12232b;border-radius:12px;margin:8px 0}.me{background:#19382d}.trace{font:12px ui-monospace,monospace;white-space:pre-wrap;max-height:420px;overflow:auto}.login{max-width:420px;margin:13vh auto;padding:18px}.state{color:var(--accent)}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{height:auto;position:sticky;top:64px;z-index:8;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}aside button{min-width:max-content}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{padding:13px}.grid,.two{grid-template-columns:1fr}.top{padding:0 12px}.top .hide{display:none}}
</style></head><body><div id="root"></div>
<script>
(function(){
"use strict";
var root=document.getElementById("root"),token=localStorage.getItem("rayone_token")||"";
var nav=[
["home","⌂ Home"],["assistant","◉ RAYONE Assistant"],["studio","✦ Create Studio"],["research","⌕ Research"],["projects","▦ Projects"],["providers","◉ Providers"],["models","◆ Models"],["tools","⚙ Tools"],["native","⚡ Native Engines"],["agents","◈ Agents"],["workflows","↯ Workflows"],["memory","◆ Memory"],["files","▤ Knowledge / Files"],["automation","◷ Automation"],["media","◇ Creative / Media"],["connectors","⬡ Connectors"],["security","▣ Security / Approval"],["observability","◌ Observability"],["recovery","⟳ Recovery"],["settings","⚙ Settings"]
];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]||c});}
async function api(url,opt){
 opt=opt||{};opt.headers=Object.assign({},opt.headers||{},token?{"Authorization":"Bearer "+token}:{});
 var r=await fetch(url,opt);
 if(r.status===401){logout();throw Error("Authentication required")}
 if(!r.ok)throw Error(await r.text());
 return r.json();
}
function loginUI(){root.innerHTML='<div class="login"><div class="card"><div class="brand">RAYONE AI</div><p class="muted">Universal AI Command Center</p><input id="loginPassword" type="password" placeholder="Admin password"><button id="loginButton" class="btn primary" style="width:100%;margin-top:10px">Enter Command Center</button><p id="loginError" class="danger"></p></div></div>';document.getElementById("loginButton").onclick=login;document.getElementById("loginPassword").onkeydown=function(e){if(e.key==="Enter")login()}}
async function login(){try{var p=document.getElementById("loginPassword").value,r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});if(!r.ok)throw Error("Invalid credentials");var d=await r.json();token=d.token;localStorage.setItem("rayone_token",token);render()}catch(e){document.getElementById("loginError").textContent=e.message}}
function logout(){token="";localStorage.removeItem("rayone_token");loginUI()}
function render(){
 var navHtml=nav.map(function(n,i){return '<button class="'+(i===0?"active":"")+'" data-view="'+n[0]+'">'+n[1]+"</button>"}).join("");
 root.innerHTML='<header class="top"><div class="brand">RAYONE AI</div><span class="pill">CORE ONLINE</span><span class="muted hide">RAYONE → VORQYON → VERIFIED</span><span class="grow"></span><button id="diag" class="btn">Diagnostics</button><span id="engine" class="pill">LOCAL ENGINES</span><button id="logout" class="btn">Logout</button></header><div class="shell"><aside>'+navHtml+'</aside><main>'+
 '<section id="home" class="view active"><h1>Universal Command Center</h1><p class="muted">One intelligence core · controlled execution · verification · audit · recovery</p><div id="stats" class="grid"></div><div class="card" style="margin-top:14px"><h3>System Pipeline</h3><p class="muted">User → Auth → RAYONE Core → Context/Memory → Planner → Router → Model / Tool / Agent / Workflow → VORQYON → Verification → Result → Audit/Metrics → Recovery</p></div></section>'+
 '<section id="assistant" class="view"><h1>RAYONE Assistant</h1><div class="card"><div id="chat" class="chatbox"></div><div class="row"><input id="msg" placeholder="Ask RAYONE anything…"><button id="ask" class="btn primary">Run</button></div><div class="toolbar"><button id="voice" class="btn">Voice Input</button><button id="trace" class="btn">Execution Trace</button></div></div></section>'+
 '<section id="projects" class="view"><h1>Projects</h1><div class="card"><div class="row"><input id="pn" placeholder="Project name"><button id="addProject" class="btn primary">Create</button></div><div id="pl" class="list"></div></div></section>'+
 '<section id="providers" class="view"><h1>AI Providers</h1><div class="card"><div class="two"><input id="prn" placeholder="Provider name"><input id="pru" placeholder="Base URL"><input id="prk" type="password" placeholder="API key"><select id="prkind"><option value="openai_compatible">openai_compatible</option><option value="ollama">ollama</option><option value="lmstudio">lmstudio</option></select><button id="addProvider" class="btn primary">Add Provider</button></div><div id="prl" class="list"></div></div></section>'+
 '<section id="models" class="view"><h1>Models</h1><div class="card"><div class="two"><input id="mn" placeholder="Display name"><input id="mi" placeholder="Model identifier"><select id="mp"></select></div><button id="addModel" class="btn primary">Add Model</button><div id="ml" class="list"></div></div></section>'+
 '<section id="tools" class="view"><h1>Tool Engine</h1><div class="card"><div id="tl" class="list"></div></div></section>'+
 '<section id="studio" class="view"><h1>Create Studio</h1><p class="muted">Real local-first creative execution · generate → verify → persist → audit</p><div class="card"><div class="two"><div><label class="muted">Creation type</label><select id="studioKind"><option value="image">Image</option><option value="design">Design</option><option value="audio">Audio</option><option value="music">Music</option><option value="voice">Voice</option><option value="video">Video</option></select></div><div><label class="muted">Aspect ratio</label><select id="studioRatio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option></select></div></div><textarea id="studioPrompt" placeholder="Describe what you want RAYONE to create..."></textarea><div class="toolbar"><button id="studioExecute" class="btn primary">Execute Creation</button><button id="studioRefresh" class="btn">Execution History</button></div><pre id="studioResult" class="trace"></pre></div><div id="studioRuns" class="list"></div></section><section id="research" class="view"><h1>Research</h1><p class="muted">Search → process → result · web first with local workspace fallback</p><div class="card"><div class="row"><input id="researchQuery" placeholder="Ask a research question or enter a URL"><input id="researchLimit" type="number" min="1" max="10" value="5" style="max-width:110px"><button id="researchExecute" class="btn primary">Research</button></div><pre id="researchResult" class="trace"></pre></div></section><section id="native" class="view"><h1>Native Advanced Engines</h1><div class="card"><div class="toolbar"><button id="nativeStatus" class="btn primary">Engine Status</button></div><div class="row"><input id="nq" placeholder="Search your local knowledge/workspace"><button id="nativeSearch" class="btn primary">Search</button></div><pre id="no" class="trace"></pre></div></section>'+
 '<section id="agents" class="view"><h1>Agents</h1><div class="card"><div class="two"><input id="an" placeholder="Agent name"><input id="ad" placeholder="Description"><select id="am"></select></div><button id="addAgent" class="btn primary">Create Agent</button><div id="al" class="list"></div></div></section>'+
 '<section id="workflows" class="view"><h1>Workflows</h1><div class="card"><div class="two"><input id="wn" placeholder="Workflow name"><textarea id="ws" placeholder="[{&quot;type&quot;:&quot;tool&quot;,&quot;name&quot;:&quot;core.echo&quot;,&quot;args&quot;:{&quot;text&quot;:&quot;hello&quot;}}]"></textarea></div><button id="addWorkflow" class="btn primary">Create Workflow</button><div id="wl" class="list"></div></div></section>'+
 '<section id="memory" class="view"><h1>Memory / Context</h1><div class="card"><div class="row"><input id="mt" placeholder="Store durable memory"><button id="saveMemory" class="btn primary">Save</button></div><div id="meml" class="list"></div></div></section>'+
 '<section id="files" class="view"><h1>Knowledge / Files</h1><div class="card"><input id="file" type="file"><button id="upload" class="btn primary">Upload</button><div id="fl" class="list"></div></div></section>'+
 '<section id="automation" class="view"><h1>Automation / Scheduler</h1><div class="card"><div class="two"><input id="sn" placeholder="Schedule name"><input id="se" placeholder="Interval seconds"><input id="sm" placeholder="Chat message"><select id="sa"><option value="chat">chat</option></select></div><button id="addSchedule" class="btn primary">Create Schedule</button><div id="sl" class="list"></div></div></section>'+
 '<section id="media" class="view"><h1>Creative / Media</h1><div class="card"><div class="two"><select id="mk"><option>image</option><option>video</option><option>audio</option><option>voice</option><option>music</option></select><textarea id="mi2" placeholder="Describe the media job"></textarea></div><button id="addMedia" class="btn primary">Queue Media Job</button><div id="medl" class="list"></div></div></section>'+
 '<section id="connectors" class="view"><h1>Connectors / Plugins</h1><div class="card"><div class="two"><input id="cn" placeholder="Connector name"><input id="ck" placeholder="Type: github, email, whatsapp…"><input id="cu" placeholder="Base URL"><textarea id="cc" placeholder="Config JSON"></textarea></div><button id="addConnector" class="btn primary">Register Connector</button><div id="cl" class="list"></div></div></section>'+
 '<section id="security" class="view"><h1>Security / Permissions / Approval</h1><div class="card"><h3>Permissions</h3><div class="row"><input id="pc" placeholder="Capability"><input id="ps" placeholder="Scope"><button id="addPermission" class="btn primary">Allow</button></div><div id="perml" class="list"></div><h3>Pending Approvals</h3><div id="appl" class="list"></div></div></section>'+
 '<section id="observability" class="view"><h1>Observability</h1><div class="card"><button id="loadObs" class="btn">Refresh</button><pre id="obs" class="trace"></pre></div></section>'+
 '<section id="recovery" class="view"><h1>Recovery / Checkpoints</h1><div class="card"><div class="toolbar"><button id="checkpoint" class="btn primary">Create Checkpoint</button><button id="restore" class="btn">Restore Last</button><button id="exportState" class="btn">Export State</button><button id="createBackup" class="btn">Create Backup</button><button id="listBackups" class="btn">Backup List</button></div><pre id="rec" class="trace"></pre></div></section>'+
 '<section id="settings" class="view"><h1>System Settings</h1><div class="card"><h3>Admin Password</h3><div class="row"><input id="oldpass" type="password" placeholder="Current password"><input id="newpass" type="password" placeholder="New password (12+ chars)"><button id="changePassword" class="btn primary">Change Password</button></div><div class="toolbar"><button id="loadSettings" class="btn">Refresh Security Config</button><button id="providerHealth" class="btn">Provider Health</button></div><pre id="setout" class="trace"></pre></div></section>'+
 '</main></div>';
 document.querySelectorAll("aside button").forEach(function(b){b.onclick=function(){show(b.getAttribute("data-view"),b)}});
 document.getElementById("logout").onclick=logout;
 document.getElementById("diag").onclick=diag;
 wire();
 loadHome();
}
function show(id,b){document.querySelectorAll(".view").forEach(function(x){x.classList.remove("active")});document.getElementById(id).classList.add("active");document.querySelectorAll("aside button").forEach(function(x){x.classList.remove("active")});b.classList.add("active");load(id)}
function wire(){
 document.getElementById("ask").onclick=ask;document.getElementById("voice").onclick=voice;document.getElementById("trace").onclick=loadTrace;
 document.getElementById("addProject").onclick=addProject;document.getElementById("addProvider").onclick=addProvider;document.getElementById("addModel").onclick=addModel;document.getElementById("nativeStatus").onclick=nativeStatus;document.getElementById("nativeSearch").onclick=nativeSearch;
 document.getElementById("addAgent").onclick=addAgent;document.getElementById("addWorkflow").onclick=addWorkflow;document.getElementById("studioExecute").onclick=runStudio;document.getElementById("studioRefresh").onclick=loadStudioRuns;document.getElementById("researchExecute").onclick=runResearch;document.getElementById("saveMemory").onclick=saveMemory;document.getElementById("upload").onclick=upload;document.getElementById("addSchedule").onclick=addSchedule;document.getElementById("addMedia").onclick=addMedia;document.getElementById("addConnector").onclick=addConnector;document.getElementById("addPermission").onclick=addPermission;document.getElementById("loadObs").onclick=loadObs;
 document.getElementById("checkpoint").onclick=checkpoint;document.getElementById("restore").onclick=restore;document.getElementById("exportState").onclick=exportState;document.getElementById("createBackup").onclick=createBackup;document.getElementById("listBackups").onclick=listBackups;document.getElementById("changePassword").onclick=changePassword;document.getElementById("loadSettings").onclick=loadSettings;document.getElementById("providerHealth").onclick=providerHealth;
}
function load(id){try{if(id==="home")loadHome();if(id==="studio")loadStudioRuns();if(id==="research"){}if(id==="projects")loadProjects();if(id==="providers")loadProviders();if(id==="models")loadModels();if(id==="tools")loadTools();if(id==="native")nativeStatus();if(id==="agents")loadAgents();if(id==="workflows")loadWorkflows();if(id==="memory")loadMemory();if(id==="files")loadFiles();if(id==="automation")loadSchedules();if(id==="media")loadMedia();if(id==="connectors")loadConnectors();if(id==="security")loadSecurity();if(id==="observability")loadObs();if(id==="settings")loadSettings()}catch(e){alert(e.message)}}
async function loadHome(){var x=await api("/api/v2/status");var n;try{n=await api("/api/v2/native/status");document.getElementById("engine").textContent="NATIVE "+Object.values(n.engines).filter(Boolean).length+" ONLINE"}catch(e){}document.getElementById("stats").innerHTML=Object.keys(x.counts||{}).map(function(k){return '<div class="card"><div class="muted">'+esc(k)+'</div><div class="num">'+x.counts[k]+"</div></div>"}).join("")}
async function ask(){var el=document.getElementById("msg"),v=el.value.trim();if(!v)return;document.getElementById("chat").innerHTML+='<div class="msg me">'+esc(v)+"</div>";el.value="";var x=await api("/api/v2/assistant/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:v})});document.getElementById("chat").innerHTML+='<div class="msg">'+esc(x.answer||x.message||JSON.stringify(x.result||x))+'<div class="muted">'+esc(x.state||x.provider||x.intent||"")+"</div></div>";document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight}
function voice(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert("Speech recognition is not available in this browser.");var r=new R();r.lang="en-IN";r.onresult=function(e){document.getElementById("msg").value=e.results[0][0].transcript;ask()};r.start()}
async function runStudio(){var prompt=document.getElementById("studioPrompt").value.trim();if(!prompt)return alert("Describe the creation first.");var kind=document.getElementById("studioKind").value;var ratio=document.getElementById("studioRatio").value;document.getElementById("studioResult").textContent="Executing...";try{var x=await api("/api/v2/studio/execute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:kind,input:{prompt:prompt,aspect_ratio:ratio},max_attempts:2})});document.getElementById("studioResult").textContent=JSON.stringify(x,null,2);loadStudioRuns()}catch(e){document.getElementById("studioResult").textContent=e.message}}
async function loadStudioRuns(){var x=await api("/api/v2/execution/runs?limit=30");var rows=x.filter(function(r){return r.surface==="studio"});document.getElementById("studioRuns").innerHTML=rows.map(function(r){return '<div class="item"><b>'+esc(r.target||"studio")+'</b><div class="muted">'+esc(r.status)+" · attempts "+esc(r.attempts)+" · "+new Date(r.created*1000).toLocaleString()+"</div></div>"}).join("")||'<div class="muted">No studio executions yet.</div>'}
async function runResearch(){var q=document.getElementById("researchQuery").value.trim();if(!q)return alert("Enter a research query.");document.getElementById("researchResult").textContent="Searching and processing...";try{var x=await api("/api/v2/research/execute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,max_sources:Number(document.getElementById("researchLimit").value)||5,max_attempts:2})});document.getElementById("researchResult").textContent=JSON.stringify(x,null,2)}catch(e){document.getElementById("researchResult").textContent=e.message}}
async function runAgent(id){var message=prompt("What should this agent execute?");if(!message)return;try{var x=await api("/api/v2/agents/"+encodeURIComponent(id)+"/execute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:message,max_steps:5,max_attempts:2})});alert(JSON.stringify(x,null,2));loadAgents()}catch(e){alert(e.message)}}
async function runWorkflow(id){var raw=prompt("Workflow input JSON (optional):","{}");if(raw===null)return;var input={};try{input=JSON.parse(raw||"{}")}catch(e){return alert("Invalid JSON input")};try{var x=await api("/api/v2/workflows/"+encodeURIComponent(id)+"/execute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({input:input,max_attempts:2})});alert(JSON.stringify(x,null,2));loadWorkflows()}catch(e){alert(e.message)}}
async function loadProjects(){var x=await api("/api/projects");document.getElementById("pl").innerHTML=x.map(function(p){return '<div class="item"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.type)+" · "+esc(p.status)+"</div></div>"}).join("")||'<div class="muted">No projects.</div>'}
async function addProject(){var v=document.getElementById("pn").value.trim();if(!v)return;await api("/api/projects",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:v})});document.getElementById("pn").value="";loadProjects();loadHome()}
async function loadProviders(){var x=await api("/api/providers");document.getElementById("prl").innerHTML=x.map(function(p){return '<div class="item"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.kind)+" · "+esc(p.base_url||"local")+"</div></div>"}).join("")||'<div class="muted">No providers.</div>'}
async function addProvider(){await api("/api/providers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("prn").value,base_url:document.getElementById("pru").value,api_key:document.getElementById("prk").value,kind:document.getElementById("prkind").value})});document.getElementById("prn").value=document.getElementById("pru").value=document.getElementById("prk").value="";loadProviders()}
async function loadModels(){var p=await api("/api/providers"),m=await api("/api/models"),sel=document.getElementById("mp");sel.innerHTML='<option value="">No provider</option>'+p.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+"</option>"}).join("");document.getElementById("ml").innerHTML=m.map(function(x){return '<div class="item"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.model)+"</div></div>"}).join("")||'<div class="muted">No models.</div>'}
async function addModel(){await api("/api/models",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("mn").value,model:document.getElementById("mi").value,provider_id:document.getElementById("mp").value||null})});document.getElementById("mn").value=document.getElementById("mi").value="";loadModels()}
async function nativeStatus(){document.getElementById("no").textContent=JSON.stringify(await api("/api/v2/native/status"),null,2)}
async function nativeSearch(){var q=document.getElementById("nq").value.trim();if(q)document.getElementById("no").textContent=JSON.stringify(await api("/api/v2/native/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})}),null,2)}
async function loadTools(){var x=await api("/api/tools"),c=await api("/api/v2/tools/catalog");document.getElementById("tl").innerHTML='<div class="item"><b>Local zero-cost tool pack: '+c.count+' executable operations</b><div class="muted">Families: '+esc((c.families||[]).join(", "))+"</div></div>"+x.map(function(t){return '<div class="item"><b>'+esc(t.name)+'</b><div class="muted">'+esc(t.description)+" · "+(t.enabled?"enabled":"disabled")+"</div></div>"}).join("")}
async function loadAgents(){var m=await api("/api/models"),a=await api("/api/agents"),sel=document.getElementById("am");sel.innerHTML='<option value="">Auto model</option>'+m.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+"</option>"}).join("");document.getElementById("al").innerHTML=a.map(function(x){return '<div class="item"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.description)+"</div><div class=\"toolbar\"><button class=\"btn primary\" onclick=\"runAgent('"+x.id+"')\">Execute Agent</button></div></div>"}).join("")||'<div class="muted">No agents.</div>'}
async function addAgent(){await api("/api/agents",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("an").value,description:document.getElementById("ad").value,model_id:document.getElementById("am").value||null})});document.getElementById("an").value=document.getElementById("ad").value="";loadAgents()}
async function loadWorkflows(){var x=await api("/api/workflows");document.getElementById("wl").innerHTML=x.map(function(w){return '<div class="item"><b>'+esc(w.name)+'</b><div class="muted">v'+w.version+" · "+w.steps.length+' steps</div><div class=\"toolbar\"><button class=\"btn primary\" onclick=\"runWorkflow('"+w.id+"')\">Execute Workflow</button></div></div>'}).join("")||'<div class="muted">No workflows.</div>'}
async function addWorkflow(){var steps;try{steps=JSON.parse(document.getElementById("ws").value||"[]")}catch(e){return alert("Invalid JSON")};await api("/api/workflows",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("wn").value,steps:steps})});document.getElementById("wn").value=document.getElementById("ws").value="";loadWorkflows()}
async function saveMemory(){var e=document.getElementById("mt");if(!e.value.trim())return;await api("/api/memory",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:e.value})});e.value="";loadMemory()}
async function loadMemory(){var x=await api("/api/memory/search?q=");document.getElementById("meml").innerHTML=x.map(function(m){return '<div class="item">'+esc(m.content)+"</div>"}).join("")||'<div class="muted">No memory.</div>'}
async function upload(){var f=document.getElementById("file").files[0];if(!f)return;var fd=new FormData();fd.append("file",f);await api("/api/v2/files/upload",{method:"POST",body:fd});document.getElementById("file").value="";loadFiles()}
async function loadFiles(){var x=await api("/api/v2/files");document.getElementById("fl").innerHTML=x.map(function(f){return '<div class="item"><b>'+esc(f.name)+'</b><div class="muted">'+f.size+" bytes · "+esc(f.mime)+"</div></div>"}).join("")||'<div class="muted">No files.</div>'}
async function addSchedule(){await api("/api/v2/automation/schedules",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("sn").value,expression:document.getElementById("se").value||"3600",action:"chat",payload:{message:document.getElementById("sm").value}})});loadSchedules()}
async function loadSchedules(){var x=await api("/api/v2/automation/schedules");document.getElementById("sl").innerHTML=x.map(function(s){return '<div class="item"><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.kind)+" · "+esc(s.expression)+" · "+(s.enabled?"enabled":"disabled")+"</div></div>"}).join("")||'<div class="muted">No schedules.</div>'}
async function addMedia(){await api("/api/v2/media",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind:document.getElementById("mk").value,input:{prompt:document.getElementById("mi2").value}})});document.getElementById("mi2").value="";loadMedia()}
async function loadMedia(){var x=await api("/api/v2/media");document.getElementById("medl").innerHTML=x.map(function(m){return '<div class="item"><b>'+esc(m.kind)+'</b><div class="muted">'+esc(m.status)+" · "+esc(m.id)+"</div></div>"}).join("")||'<div class="muted">No media jobs.</div>'}
async function addConnector(){var cfg={};try{cfg=JSON.parse(document.getElementById("cc").value||"{}")}catch(e){return alert("Invalid config JSON")};await api("/api/v2/connectors",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("cn").value,kind:document.getElementById("ck").value,base_url:document.getElementById("cu").value,config:cfg})});loadConnectors()}
async function loadConnectors(){var x=await api("/api/v2/connectors");document.getElementById("cl").innerHTML=x.map(function(c){return '<div class="item"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.kind)+" · "+esc(c.base_url||"")+"</div></div>"}).join("")||'<div class="muted">No connectors.</div>'}
async function addPermission(){if(!document.getElementById("pc").value)return;await api("/api/v2/permissions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({capability:document.getElementById("pc").value,scope:document.getElementById("ps").value||"global"})});loadSecurity()}
async function loadSecurity(){var p=await api("/api/v2/permissions"),a=await api("/api/v2/approvals");document.getElementById("perml").innerHTML=p.map(function(x){return '<div class="item">'+esc(x.subject)+" · <b>"+esc(x.capability)+"</b> · "+esc(x.scope)+"</div>"}).join("")||'<div class="muted">No permissions.</div>';document.getElementById("appl").innerHTML=a.filter(function(x){return x.status==="pending"}).map(function(x){return '<div class="item"><b>'+esc(x.action)+"</b> · "+esc(x.target)+"</div>"}).join("")||'<div class="muted">No pending approvals.</div>'}
async function loadObs(){var a=await api("/api/v2/trace"),m=await api("/api/v2/metrics");document.getElementById("obs").textContent=JSON.stringify({metrics:m,traces:a},null,2)}
async function checkpoint(){var x=await api("/api/checkpoints?target=universal-control-plane",{method:"POST"});document.getElementById("rec").textContent="Checkpoint created: "+x.id}
async function restore(){var x=await api("/api/checkpoints");if(x[0]&&confirm("Restore latest checkpoint?")){await api("/api/checkpoints/"+x[0].id+"/restore",{method:"POST"});document.getElementById("rec").textContent="Restored: "+x[0].id}}
async function exportState(){var x=await api("/api/export");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:"application/json"}));a.download="rayone-state.json";a.click()}
async function createBackup(){document.getElementById("rec").textContent=JSON.stringify(await api("/api/v2/backup/create",{method:"POST"}),null,2)}
async function listBackups(){document.getElementById("rec").textContent=JSON.stringify(await api("/api/v2/backup/list"),null,2)}
async function changePassword(){var x=await api("/api/v2/security/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({current_password:document.getElementById("oldpass").value,new_password:document.getElementById("newpass").value})});document.getElementById("setout").textContent=JSON.stringify(x,null,2)}
async function loadSettings(){document.getElementById("setout").textContent=JSON.stringify(await api("/api/v2/security/config"),null,2)}
async function providerHealth(){document.getElementById("setout").textContent=JSON.stringify(await api("/api/v2/providers/health"),null,2)}
async function loadTrace(){document.getElementById("chat").innerHTML+='<pre class="trace">'+esc(JSON.stringify((await api("/api/v2/trace")).slice(0,20),null,2))+"</pre>"}
async function diag(){alert(JSON.stringify(await api("/api/v2/diagnostics"),null,2))}
if(token){api("/api/health").then(function(){render()}).catch(loginUI)}else loginUI();
})();
</script></body></html>
